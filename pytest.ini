[pytest]
;addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir
;
;testpaths = ./testcase/

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py

python_classes = Test*

python_functions = test


markers =
    smoke: 核心冒烟测试用例，挂载至 CI/CD 流水线，代码提交/合并即触发（控制在20%以内）
    regression: 功能回归测试用例，用于发版前的全量功能验证
    weekly: 细节/边角料测试用例，执行耗时较长，由 Jenkins 定时器每周触发执行
    p0: 最高优先级用例，核心交易链路
    p1: 次高优先级用例，正常业务流程
    p2: 低优先级用例，异常边界值或UI细节校验