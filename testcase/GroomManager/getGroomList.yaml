- baseInfo:
    system: user
    api_name: 场馆列表
    url: /kk/promen/groom/list
    method: Get
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      pmtoken: ${get_extract_data(user_token)}
      device: '1'
  testCase:
    - case_name: 获取场馆列表
      validation:
        - contains: { 'code': 'SPORT' }
