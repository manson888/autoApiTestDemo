- baseInfo:
    system: user
    api_name: 存款通道列表
    url: /kk/promen/cashin/channel/list
    method: Get
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      pmtoken: ${get_extract_data(user_token)}
      device: '1'
  testCase:
    - case_name: 获取存款通道列表
      validation:
        - contains: { 'msg': '查询成功' }
      extract_list:
        cashinChannelList: $.data[*].code
